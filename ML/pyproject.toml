[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ml_api*", "relativa_ml*"]

[project]
name = "relativa-ml"
version = "0.1.0"
description = "Relativa ML microservice (Django)"
requires-python = ">=3.11"
dependencies = [
    "pika>=1.3",
    "Django>=5.1,<5.2",
    "djangorestframework>=3.15",
    "psycopg2-binary>=2.9",
    "scikit-learn>=1.9,<1.10",
    "pandas>=2.0",
    "joblib>=1.3",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "msgpack>=1.2.1",
]

[project.optional-dependencies]
dev = ["black", "isort", "ruff"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 120
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
