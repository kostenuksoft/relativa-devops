{{- $component := dict "root" . "component" "postgres" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "relativa.componentName" $component }}
  labels:
    {{- include "relativa.labels" $component | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "relativa.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "relativa.labels" $component | nindent 8 }}
      annotations:
        {{- include "relativa.configChecksums" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ include "relativa.image" .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port }}
          env:
            {{- include "relativa.configEnv" (dict "root" . "name" "POSTGRES_DB" "key" "DB_NAME") | nindent 12 }}
            {{- include "relativa.configEnv" (dict "root" . "name" "POSTGRES_USER" "key" "DB_USER") | nindent 12 }}
            {{- include "relativa.secretEnv" (dict "root" . "name" "POSTGRES_PASSWORD" "key" "DB_PASSWORD") | nindent 12 }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          {{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "relativa.componentName" $component }}
          {{- else }}
          emptyDir: {}
          {{- end }}
