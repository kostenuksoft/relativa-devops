{{- $component := dict "root" . "component" "postgres" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "relativa.componentName" $component }}
  labels:
    {{- include "relativa.labels" $component | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "relativa.selectorLabels" $component | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
