{{- $component := dict "root" . "component" "migration" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "relativa.componentName" $component }}
  labels:
    {{- include "relativa.labels" $component | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "relativa.labels" $component | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "relativa.image" .Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h \"$DB_HOST\" -p \"$DB_PORT\"; do sleep 2; done"]
          env:
            {{- include "relativa.configEnv" (dict "root" . "name" "DB_HOST") | nindent 12 }}
            {{- include "relativa.configEnv" (dict "root" . "name" "DB_PORT") | nindent 12 }}
          resources:
            {{- toYaml .Values.waitImage.resources | nindent 12 }}
      containers:
        - name: migration
          image: {{ include "relativa.appImage" $component }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "relativa.databaseEnv" (dict "root" . "passwordName" "DB_PASS") | nindent 12 }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
