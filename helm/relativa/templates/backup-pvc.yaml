{{- if .Values.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "relativa.componentName" (dict "root" . "component" "backup") }}
  labels:
    {{- include "relativa.labels" (dict "root" . "component" "backup") | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.backup.persistence.accessModes | nindent 4 }}
  {{- with .Values.backup.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ include "relativa.claimSize" (dict "root" . "name" (include "relativa.componentName" (dict "root" . "component" "backup")) "size" .Values.backup.persistence.size) }}
{{- end }}
