apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: relativa
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: relativa
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: relativa
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
