apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: relativa
  labels:
    app.kubernetes.io/name: client
    app.kubernetes.io/part-of: relativa
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: client
      app.kubernetes.io/part-of: relativa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: client
        app.kubernetes.io/part-of: relativa
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: client
          image: ghcr.io/kostenuksoft/relativa-client:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: VITE_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: GATEWAY_PUBLIC_URL
            - name: VITE_ALLOWED_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: CLIENT_ALLOWED_HOSTS
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
