apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit
  namespace: relativa
  labels:
    app.kubernetes.io/name: audit
    app.kubernetes.io/part-of: relativa
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: audit
      app.kubernetes.io/part-of: relativa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit
        app.kubernetes.io/part-of: relativa
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: migration-reader
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z \"$DB_HOST\" \"$DB_PORT\" && nc -z \"$RABBITMQ_HOST\" \"$RABBITMQ_PORT\"; do sleep 2; done"]
          envFrom:
            - configMapRef:
                name: relativa-config
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
        - name: wait-for-migration-job
          image: registry.k8s.io/kubectl:v1.37.0
          args: ["wait", "--for=create", "job/migration", "--timeout=10m"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: wait-for-migration
          image: registry.k8s.io/kubectl:v1.37.0
          args: ["wait", "--for=condition=complete", "job/migration", "--timeout=10m"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: audit
          image: ghcr.io/kostenuksoft/relativa-audit:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8086
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: relativa-secrets
                  key: DB_PASSWORD
            - name: ConnectionStrings__Default
              value: Host=$(DB_HOST);Port=$(DB_PORT);Database=$(DB_NAME);Username=$(DB_USER);Password=$(DB_PASSWORD)
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: relativa-secrets
                  key: JWT_SECRET_KEY
            - name: Jwt__Issuer
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: JWT_ISSUER
            - name: Jwt__Audience
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: JWT_AUDIENCE
            - name: RabbitMqAudit__Host
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: RABBITMQ_HOST
            - name: RabbitMqAudit__Port
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: RABBITMQ_PORT
            - name: RabbitMqAudit__Username
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: RABBITMQ_USER
            - name: RabbitMqAudit__Password
              valueFrom:
                secretKeyRef:
                  name: relativa-secrets
                  key: RABBITMQ_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
