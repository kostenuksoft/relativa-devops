apiVersion: batch/v1
kind: Job
metadata:
  name: migration
  namespace: relativa
  labels:
    app.kubernetes.io/name: migration
    app.kubernetes.io/part-of: relativa
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migration
        app.kubernetes.io/part-of: relativa
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h \"$DB_HOST\" -p \"$DB_PORT\"; do sleep 2; done"]
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: DB_PORT
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: migration
          image: ghcr.io/kostenuksoft/relativa-migration:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: relativa-secrets
                  key: DB_PASSWORD
            - name: ConnectionStrings__Default
              value: Host=$(DB_HOST);Port=$(DB_PORT);Database=$(DB_NAME);Username=$(DB_USER);Password=$(DB_PASS)
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
